<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sekolah Muslim — Petualangan Ilmu & Ibadah</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
html, body { width:100%; height:100%; overflow:hidden; background:#000; font-family:'Segoe UI',Arial,sans-serif; touch-action:none; }
#gameCanvas { display:block; width:100%; height:100%; position:fixed; inset:0; }
#hud { position:fixed; top:8px; left:8px; right:8px; display:flex; justify-content:space-between; align-items:flex-start; pointer-events:none; z-index:20; }
.hud-left { display:flex; flex-direction:column; gap:6px; }
.badge { background:rgba(0,0,0,.55); color:#fff; padding:5px 10px; border-radius:14px; font-size:12px; display:flex; align-items:center; gap:6px; backdrop-filter:blur(6px); border:1px solid rgba(255,255,255,.15); pointer-events:none; }
.badge.money { color:#ffd700; }
.badge.kelas { color:#7cf0b0; cursor:pointer; pointer-events:auto; }
.badge.time { color:#9fd6ff; }
.badge.nick { color:#ffcf9f; }
.badge.room { color:#ff9f9f; background:rgba(180,40,40,.7); border-color:#ff6b6b; }
#bookBtn { background:linear-gradient(135deg,#8b5a2b,#c99a00); color:#fff; border:2px solid #ffd700; padding:6px 12px; border-radius:14px; font-size:12px; cursor:pointer; pointer-events:auto; touch-action:manipulation; display:flex; align-items:center; gap:6px; font-weight:bold; }
#bookBtn:active { transform:scale(.95); }
#missionBar { position:fixed; top:64px; left:50%; transform:translateX(-50%); background:rgba(0,80,40,.75); color:#fff; padding:6px 14px; border-radius:14px; font-size:12px; max-width:60%; text-align:center; border:1px solid rgba(255,215,0,.4); z-index:20; pointer-events:none; }
#missionBar b { color:#ffd700; }
.topbtns { display:flex; gap:8px; position:fixed; top:8px; right:8px; z-index:100; pointer-events:auto; touch-action:manipulation; }
.iconbtn { width:48px; height:48px; border-radius:12px; background:rgba(0,0,0,.75); color:#fff; border:2px solid rgba(255,215,0,.5); font-size:20px; display:flex; align-items:center; justify-content:center; cursor:pointer; pointer-events:auto; touch-action:manipulation; -webkit-tap-highlight-color:transparent; box-shadow:0 4px 12px rgba(0,0,0,.4); position:relative; }
.iconbtn:active { background:rgba(255,215,0,.7); color:#000; }
.iconbtn.active { background:rgba(255,215,0,.85); color:#000; }
.iconbtn.clock { cursor:default; font-size:10px; flex-direction:column; gap:1px; width:auto; padding:0 10px; line-height:1.1; }
.iconbtn.mabar-highlight { background:linear-gradient(135deg,#06b6d4,#0891b2); border-color:#22d3ee; box-shadow:0 0 20px rgba(6,182,212,.6); flex-direction:column; gap:1px; font-size:18px; animation:mabar-pulse 2s ease-in-out infinite; }
@keyframes mabar-pulse { 0%, 100% { box-shadow:0 0 20px rgba(6,182,212,.6); } 50% { box-shadow:0 0 30px rgba(6,182,212,.9); } }
.iconbtn.notif-btn { background:linear-gradient(135deg,#dc2626,#f59e0b); border-color:#fbbf24; animation:notif-pulse 1.5s ease-in-out infinite; }
@keyframes notif-pulse { 0%,100%{box-shadow:0 0 12px rgba(245,158,11,.6);} 50%{box-shadow:0 0 24px rgba(245,158,11,1);} }
.notif-count { position:absolute; top:-6px; right:-6px; background:#ef4444; color:#fff; font-size:10px; font-weight:bold; width:20px; height:20px; border-radius:50%; display:flex; align-items:center; justify-content:center; border:2px solid #fff; }

#interactPrompt { position:fixed; top:8px; left:8px; background:rgba(0,0,0,.8); color:#ffd700; padding:8px 14px; border-radius:12px; font-size:13px; border:2px solid rgba(255,215,0,.6); display:none; z-index:22; pointer-events:none; max-width:60%; box-shadow:0 4px 12px rgba(0,0,0,.5); }

#touchControls { position:fixed; inset:0; pointer-events:none; z-index:15; display:none; }
#joystick { position:fixed; left:20px; bottom:20px; width:130px; height:130px; border-radius:50%; background:rgba(255,255,255,.12); border:2px solid rgba(255,255,255,.3); pointer-events:auto; touch-action:none; }
#stick { position:absolute; left:50%; top:50%; width:60px; height:60px; margin:-30px 0 0 -30px; border-radius:50%; background:rgba(255,215,0,.7); pointer-events:none; will-change:transform; }
#camArea { position:fixed; right:0; top:80px; width:55%; height:calc(100% - 80px); pointer-events:auto; touch-action:none; }
#touchBtns { position:fixed; right:16px; bottom:24px; display:flex; flex-direction:column; gap:10px; pointer-events:none; z-index:16; }
.tbtn { width:64px; height:64px; border-radius:50%; background:rgba(0,0,0,.6); border:2px solid rgba(255,255,255,.35); color:#fff; font-size:11px; font-weight:bold; display:flex; align-items:center; justify-content:center; pointer-events:auto; touch-action:manipulation; text-align:center; padding:4px; line-height:1.2; }
.tbtn:active { background:rgba(255,215,0,.6); color:#000; transform:scale(.95); }
.tbtn.run { background:rgba(0,120,60,.7); }
.tbtn.interact { background:rgba(200,150,0,.85); color:#000; }
.tbtn.flashlight { background:rgba(255,200,0,.85); color:#000; }
.tbtn.flashlight.on { background:rgba(255,255,100,1); box-shadow:0 0 20px #ffdd00; }
.tbtn.mabar-tbtn { background:linear-gradient(135deg,#06b6d4,#0891b2); color:#fff; border-color:#22d3ee; box-shadow:0 0 15px rgba(6,182,212,.6); }
.tbtn.door { background:rgba(120,80,0,.85); color:#fff; }
.tbtn.door.visible { display:flex; }
.tbtn.door:not(.visible) { display:none; }

#jualanBtn {
  position:fixed; left:20px; bottom:230px;
  width:64px; height:64px; border-radius:50%;
  background:linear-gradient(135deg,#c99a00,#ffd700); color:#000;
  border:2px solid #fff; font-size:20px; font-weight:bold;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  cursor:pointer; pointer-events:auto; touch-action:manipulation;
  box-shadow:0 4px 14px rgba(0,0,0,.5);
  z-index:16; line-height:1;
}
#jualanBtn:active { transform:scale(.95); background:#ffd700; }
#sholatBtn {
  position:fixed; left:20px; bottom:310px;
  width:64px; height:64px; border-radius:50%;
  background:linear-gradient(135deg,#1e8449,#0a7a4a); color:#fff;
  border:2px solid #fff; font-size:20px; font-weight:bold;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  cursor:pointer; pointer-events:auto; touch-action:manipulation;
  box-shadow:0 4px 14px rgba(0,0,0,.5);
  z-index:16; line-height:1;
}
#sholatBtn:active { transform:scale(.95); background:#1e8449; }
#jualanItem { display:flex; justify-content:space-between; align-items:center; background:rgba(255,215,0,.1); padding:8px 10px; margin:4px 0; border-radius:8px; border-left:3px solid #ffd700; font-size:13px; }
#jualanItem .jp-name { color:#fff; font-weight:bold; }
#jualanItem .jp-price { color:#ffd700; font-weight:bold; margin-right:8px; }
#jualanItem .jp-del { background:rgba(200,40,40,.7); color:#fff; border:none; border-radius:6px; padding:4px 8px; font-size:11px; cursor:pointer; }

#dialog { position:fixed; left:50%; bottom:20px; transform:translateX(-50%); width:94%; max-width:560px; background:linear-gradient(160deg,rgba(10,30,20,.98),rgba(5,20,12,.98)); border:2px solid #ffd700; border-radius:18px; padding:16px 18px; color:#fff; z-index:30; display:none; box-shadow:0 8px 40px rgba(0,0,0,.8); }
#dialog .dname { color:#ffd700; font-weight:bold; margin-bottom:8px; font-size:15px; padding-bottom:6px; border-bottom:1px solid rgba(255,215,0,.3); display:flex; align-items:center; gap:8px; }
#dialog .dname .avatar { width:28px; height:28px; border-radius:50%; background:linear-gradient(135deg,#0a7a4a,#0d9b5e); display:flex; align-items:center; justify-content:center; font-size:16px; }
#dialog .dtext { font-size:14px; line-height:1.6; min-height:50px; color:#e8f5e9; padding:4px 0; }
#dialog .dchoices { display:flex; flex-direction:column; gap:8px; margin-top:12px; max-height:320px; overflow-y:auto; }
#dialog .dchoice { background:rgba(255,215,0,.12); border:1.5px solid rgba(255,215,0,.4); color:#fff; padding:11px 14px; border-radius:10px; font-size:13px; text-align:left; cursor:pointer; display:flex; justify-content:space-between; align-items:center; gap:8px; }
#dialog .dchoice:active { background:rgba(255,215,0,.5); color:#000; }
#dialog .dchoice .price { color:#ffd700; font-weight:bold; font-size:12px; padding:2px 8px; background:rgba(0,0,0,.3); border-radius:8px; }
#dialog .dchoice.special { background:rgba(10,120,74,.4); border-color:#0d9b5e; }
#dialog .dclose { position:absolute; right:12px; top:10px; color:#fff; background:rgba(255,255,255,.15); border:none; font-size:16px; cursor:pointer; width:28px; height:28px; border-radius:50%; }

#speechBubble { position:fixed; transform:translate(-50%,-100%); background:linear-gradient(160deg,#1a1a1a,#000); color:#ffd700; padding:10px 16px; border-radius:12px; border:2px solid #ffd700; font-size:14px; line-height:1.45; max-width:280px; min-width:160px; z-index:90; display:none; pointer-events:none; font-weight:600; text-align:center; }
#speechBubble::after { content:''; position:absolute; bottom:-12px; left:50%; transform:translateX(-50%); width:0; height:0; border-left:12px solid transparent; border-right:12px solid transparent; border-top:12px solid #ffd700; }
#speechBubble .speaker { display:block; font-weight:bold; color:#7cf0b0; font-size:11px; margin-bottom:3px; }
#speechBubble.visible { display:block; }

#introOverlay { position:fixed; inset:0; z-index:500; background:rgba(0,0,0,.5); display:none; align-items:flex-end; justify-content:center; padding-bottom:20px; pointer-events:none; }
#introOverlay.active { display:flex; }
#introCaption { background:rgba(0,0,0,.85); color:#ffd700; padding:14px 28px; border-radius:16px; border:2px solid #ffd700; font-size:18px; font-weight:bold; text-align:center; max-width:80%; }
#subtitleOverlay { position:fixed; bottom:100px; left:50%; transform:translateX(-50%); color:#fff; font-size:20px; font-weight:bold; text-align:center; max-width:92%; z-index:510; display:none; pointer-events:none; line-height:1.5; text-shadow:-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,2px 2px 0 #000,0 2px 0 #000,2px 0 0 #000,0 -2px 0 #000,-2px 0 0 #000; }
#subtitleOverlay.active { display:block; }
#doaMakanSubtitle { position:fixed; left:50%; bottom:100px; transform:translateX(-50%) translateY(16px) scale(.96); width:max-content; max-width:92vw; box-sizing:border-box; padding:12px 18px; background:rgba(0,0,0,.92); color:#fff; border:1px solid rgba(255,255,255,.25); border-radius:10px; font-size:clamp(17px,4.4vw,24px); font-weight:700; line-height:1.8; text-align:center; direction:rtl; z-index:520; display:none; opacity:0; pointer-events:none; box-shadow:0 8px 28px rgba(0,0,0,.4); }
#doaMakanSubtitle.active { display:block; animation:doaMakanIn .45s ease-out forwards; }
@keyframes doaMakanIn { from { opacity:0; transform:translateX(-50%) translateY(16px) scale(.96); } to { opacity:1; transform:translateX(-50%) translateY(0) scale(1); } }

.modal { position:fixed; inset:0; background:rgba(0,0,0,.85); z-index:100; display:none; align-items:center; justify-content:center; padding:16px; }
.modal.active { display:flex; }
.modal-box { background:linear-gradient(160deg,#0d3b2a,#062018); border:2px solid #ffd700; border-radius:18px; padding:18px; width:100%; max-width:520px; max-height:88vh; overflow-y:auto; color:#fff; }
.modal-box h2 { color:#ffd700; font-size:18px; margin-bottom:12px; text-align:center; }
.modal-box label { display:block; font-size:12px; color:#aaa; margin:8px 0 4px; }
.modal-box input[type=text], .modal-box input[type=password], .modal-box input[type=email], .modal-box select { width:100%; padding:10px 12px; border-radius:10px; border:1px solid rgba(255,215,0,.4); background:rgba(0,0,0,.4); color:#fff; font-size:14px; outline:none; }
.mbtn { background:linear-gradient(90deg,#0a7a4a,#0d9b5e); color:#fff; border:none; padding:12px 16px; border-radius:12px; font-size:14px; font-weight:bold; cursor:pointer; margin-top:8px; width:100%; }
.mbtn.alt { background:linear-gradient(90deg,#3a3a3a,#555); }
.mbtn.gold { background:linear-gradient(90deg,#c99a00,#ffd700); color:#000; }
.mbtn.red { background:linear-gradient(90deg,#a02020,#d63030); }
.mbtn.cyan { background:linear-gradient(90deg,#0e7490,#06b6d4); color:#fff; }
.mbtn.start-mabar { background:linear-gradient(90deg,#16a34a,#22c55e); color:#fff; font-size:16px; padding:16px; border:2px solid #4ade80; animation:start-pulse 1.5s ease-in-out infinite; margin-top:14px; }
@keyframes start-pulse { 0%, 100% { box-shadow:0 0 20px rgba(34,197,94,.5); } 50% { box-shadow:0 0 30px rgba(34,197,94,.9); } }
.row { display:flex; gap:8px; flex-wrap:wrap; }
.row > * { flex:1; min-width:120px; }
.chip { display:inline-block; padding:6px 12px; border-radius:20px; background:rgba(255,255,255,.1); font-size:12px; margin:3px; cursor:pointer; border:1px solid rgba(255,255,255,.2); }
.chip.sel { background:rgba(255,215,0,.5); color:#000; border-color:#ffd700; }
.avatarPreview { width:100%; height:140px; background:radial-gradient(circle,#1a4a35,#062018); border-radius:12px; margin-bottom:10px; display:flex; align-items:center; justify-content:center; font-size:12px; color:#7cf0b0; }
#outfitModal .modal-box { max-width:800px; }
.outfitContainer { display:flex; gap:14px; min-height:340px; }
.outfitPreview { flex:0 0 220px; background:radial-gradient(circle,#1a4a35 0%,#062018 100%); border-radius:14px; border:2px solid rgba(255,215,0,.4); display:flex; align-items:center; justify-content:center; flex-direction:column; padding:10px; }
#outfitPreviewCanvas { width:100%; height:100%; max-height:300px; }
.outfitPreview .preview-label { color:#7cf0b0; font-size:11px; }
.outfitItems { flex:1; background:rgba(0,0,0,.3); border-radius:14px; padding:10px; overflow-y:auto; max-height:400px; }
.outfitCategory { margin-bottom:12px; }
.outfitCategory .cat-title { color:#ffd700; font-size:13px; font-weight:bold; margin-bottom:6px; padding-bottom:4px; border-bottom:1px solid rgba(255,215,0,.3); }
.outfitItem { display:inline-flex; align-items:center; gap:6px; background:rgba(255,255,255,.06); padding:6px 10px; margin:3px; border-radius:8px; border:1px solid rgba(255,255,255,.15); font-size:11px; color:#fff; cursor:pointer; }
.outfitItem.sel { background:rgba(255,215,0,.5); color:#000; border-color:#ffd700; }

#startMenu { position:fixed; inset:0; background:linear-gradient(160deg,#062018 0%,#0a5c3a 40%,#0d3b66 100%); z-index:300; display:flex; align-items:center; justify-content:center; flex-direction:column; padding:20px; color:#fff; overflow-y:auto; }
#startMenu.hidden { display:none; }
#startMenu h1 { font-size:22px; text-align:center; color:#ffd700; margin-bottom:4px; }
#startMenu .sub { font-size:12px; color:#9fd6ff; margin-bottom:18px; text-align:center; }
#startMenu .startbtns { display:flex; flex-direction:column; gap:10px; width:100%; max-width:340px; }
.sbtn { background:linear-gradient(90deg,#0a7a4a,#0d9b5e); color:#fff; border:2px solid rgba(255,215,0,.5); padding:14px; border-radius:14px; font-size:15px; font-weight:bold; cursor:pointer; }
.sbtn.gold { background:linear-gradient(90deg,#c99a00,#ffd700); color:#000; }
.sbtn.dark { background:rgba(0,0,0,.5); }
.sbtn.blue { background:linear-gradient(90deg,#1e5a99,#2a8cd6); }
.sbtn.pink { background:linear-gradient(90deg,#9b5e7a,#d68ab4); }

/* ID AKUN POJOK KIRI ATAS MENU */
.account-card {
  position:fixed; top:12px; left:12px; z-index:302;
  background:linear-gradient(135deg,#0d3b2a,#0a5c3a);
  border:2px solid #ffd700; border-radius:14px;
  padding:10px 14px; box-shadow:0 4px 14px rgba(0,0,0,.5);
  color:#fff; cursor:pointer; display:none;
}
.account-card.show { display:block; }
.account-card .ac-label { font-size:9px; color:#ffd700; letter-spacing:2px; font-weight:bold; }
.account-card .ac-num { font-family:'Courier New',monospace; font-size:22px; font-weight:bold; letter-spacing:4px; color:#fff; margin-top:2px; }
.account-card .ac-copy { font-size:10px; color:#9fd6ff; margin-top:2px; }
.account-card:active { transform:scale(.97); }

/* TOMBOL CHAT NGOBROL POJOK KANAN BAWAH */
#menuChatBtn {
  position:fixed; bottom:18px; right:18px; z-index:302;
  background:linear-gradient(135deg,#06b6d4,#0891b2);
  border:2px solid #22d3ee; border-radius:50%;
  width:72px; height:72px; color:#fff;
  cursor:pointer; display:none;
  flex-direction:column; align-items:center; justify-content:center; gap:2px;
  box-shadow:0 6px 20px rgba(6,182,212,.6);
  font-weight:bold;
}
#menuChatBtn.show { display:flex; }
#menuChatBtn .mc-icon { font-size:26px; }
#menuChatBtn .mc-lbl { font-size:9px; }
#menuChatBtn:active { transform:scale(.95); }

/* FRIEND LIST */
.friend-header { display:flex; justify-content:space-between; align-items:center; color:#9fd6ff; font-size:12px; margin-bottom:8px; padding:0 4px; }
.friend-item {
  display:flex; justify-content:space-between; align-items:center;
  background:rgba(255,215,0,.08); padding:10px 12px; border-radius:10px;
  margin-bottom:6px; border-left:3px solid #ffd700;
}
.friend-item .f-info { flex:1; min-width:0; }
.friend-item .f-name { color:#fff; font-weight:bold; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.friend-item .f-id { color:#ffd700; font-size:11px; font-family:'Courier New',monospace; letter-spacing:2px; margin-top:2px; }
.friend-item .f-actions { display:flex; gap:5px; flex-wrap:wrap; flex-shrink:0; }
.friend-item .f-actions button {
  padding:5px 9px; border-radius:8px; font-size:10px; font-weight:bold;
  border:none; cursor:pointer; color:#fff; white-space:nowrap;
}
.friend-item .f-invite { background:linear-gradient(90deg,#16a34a,#22c55e); }
.friend-item .f-chat { background:linear-gradient(90deg,#0e7490,#06b6d4); }
.friend-item .f-del { background:linear-gradient(90deg,#a02020,#d63030); }
.friend-empty { text-align:center; color:#888; padding:20px; font-size:13px; }

/* ROOM PLAYER ACTIONS */
.room-player-item .player-actions { display:flex; gap:5px; flex-shrink:0; flex-wrap:wrap; }
.room-player-item .add-friend-mini {
  background:linear-gradient(90deg,#16a34a,#22c55e);
  color:#fff; border:none; border-radius:6px; padding:4px 8px;
  font-size:10px; font-weight:bold; cursor:pointer; white-space:nowrap;
}
.room-player-item .invite-mini {
  background:linear-gradient(90deg,#c99a00,#ffd700);
  color:#000; border:none; border-radius:6px; padding:4px 8px;
  font-size:10px; font-weight:bold; cursor:pointer; white-space:nowrap;
}
.room-player-item .add-friend-mini:active,
.room-player-item .invite-mini:active { transform:scale(.95); }

#authPanel { position:fixed; inset:0; background:linear-gradient(160deg,#062018,#0d3b66); z-index:350; display:none; align-items:center; justify-content:center; padding:20px; color:#fff; }
#authPanel.active { display:flex; }
.auth-box { background:rgba(0,0,0,.4); border:2px solid #ffd700; border-radius:18px; padding:22px; width:100%; max-width:380px; }
.auth-box h2 { color:#ffd700; text-align:center; margin-bottom:14px; font-size:20px; }
.auth-box .tabs { display:flex; margin-bottom:14px; border-radius:10px; overflow:hidden; border:1px solid rgba(255,215,0,.4); }
.auth-box .tabs button { flex:1; padding:10px; background:rgba(0,0,0,.3); color:#fff; border:none; cursor:pointer; font-size:13px; }
.auth-box .tabs button.active { background:linear-gradient(90deg,#0a7a4a,#0d9b5e); font-weight:bold; }
.auth-box input { width:100%; padding:12px; margin-bottom:10px; border-radius:10px; border:1px solid rgba(255,215,0,.4); background:rgba(0,0,0,.4); color:#fff; font-size:14px; outline:none; }
.auth-box .err { color:#ff6b6b; font-size:12px; margin-bottom:8px; min-height:16px; text-align:center; }
.auth-box .toggle-txt { text-align:center; font-size:12px; color:#9fd6ff; margin-top:12px; cursor:pointer; }

#toast { position:fixed; top:80px; left:50%; transform:translateX(-50%); background:rgba(0,80,40,.95); color:#fff; padding:10px 18px; border-radius:14px; border:1px solid #ffd700; font-size:13px; z-index:200; display:none; max-width:80%; text-align:center; pointer-events:none; }

#loader { position:fixed; inset:0; background:linear-gradient(135deg,#0a5c3a,#0d3b66); display:none; align-items:center; justify-content:center; flex-direction:column; z-index:400; color:#fff; }
#loader.active { display:flex; }
#loader h1 { font-size:20px; margin-bottom:16px; }
.loadbar { width:70%; max-width:300px; height:8px; background:rgba(255,255,255,.2); border-radius:4px; overflow:hidden; }
.loadbar > div { height:100%; width:0%; background:linear-gradient(90deg,#ffd700,#fff); transition:width .15s; }

#quranOverlay { position:fixed; inset:0; background:rgba(0,0,0,.94); z-index:80; display:none; flex-direction:column; padding:16px; color:#fff; overflow-y:auto; }
#quranOverlay.active { display:flex; }
#quranOverlay h2 { color:#ffd700; text-align:center; font-size:18px; margin-bottom:6px; }

#writeOverlay { position:fixed; inset:0; background:rgba(0,0,0,.94); z-index:80; display:none; flex-direction:column; padding:16px; color:#fff; overflow-y:auto; }

#micOverlay { position:fixed; inset:0; background:rgba(0,0,0,.94); z-index:80; display:none; flex-direction:column; align-items:center; justify-content:center; padding:20px; color:#fff; text-align:center; }

.quizChoice:hover:not(.disabled) { background:rgba(255,215,0,.25); border-color:#ffd700; }

.quizChoice.correct .choiceLetter { background:#10b981; }
.quizChoice.wrong .choiceLetter { background:#ef4444; }

#quizFeedback.correct { background:rgba(16,185,129,.2); color:#7cf0b0; border:1px solid #10b981; }
#quizFeedback.wrong { background:rgba(239,68,68,.2); color:#ff9f9f; border:1px solid #ef4444; }

.room-player-item .player-name { color:#fff; font-weight:bold; }
.room-player-item .player-tag { color:#7cf0b0; font-size:11px; }
.room-status { text-align:center; color:#7cf0b0; font-size:13px; margin:10px 0; padding:8px; background:rgba(124,240,176,.1); border-radius:8px; min-height:20px; }

.room-host-badge { display:inline-block; background:#ffd700; color:#000; padding:2px 8px; border-radius:10px; font-size:10px; font-weight:bold; margin-left:6px; }

.direct-chat-messages {
  background:rgba(0,0,0,.3); border-radius:12px; padding:10px;
  max-height:320px; overflow-y:auto; display:flex; flex-direction:column; gap:6px;
  min-height:180px;
}

  background:rgba(255,255,255,.08); padding:6px 10px; border-radius:8px;
  font-size:12px; color:#fff; max-width:80%; word-wrap:break-word;
}
.direct-chat-messages .msg.self { background:rgba(6,182,212,.3); align-self:flex-end; }

@media (max-width:600px) {

  .quizChoice { font-size:13px; padding:12px; }
  .account-card { padding:6px 10px; }

  #menuChatBtn { width:60px; height:60px; }
