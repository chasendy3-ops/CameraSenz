<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baca Manga/Manhwa</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f13;
            color: #e4e4e7;
            min-height: 100vh;
        }
        .container { max-width: 900px; margin: 0 auto; padding: 20px; }

        /* Header */
        .header {
            display: flex; align-items: center; gap: 12px;
            padding: 16px 0 24px; border-bottom: 1px solid #27272a;
            margin-bottom: 24px;
        }
        .header h1 { font-size: 1.5rem; color: #a78bfa; font-weight: 600; }
        .header span { font-size: 0.85rem; color: #71717a; }

        /* Search bar */
        .search-bar {
            display: flex; gap: 8px; margin-bottom: 24px;
        }
        .search-bar input {
            flex: 1; padding: 12px 16px; border-radius: 10px;
            border: 1px solid #3f3f46; background: #18181b;
            color: #e4e4e7; font-size: 1rem; outline: none;
            transition: border-color 0.2s;
        }
        .search-bar input:focus { border-color: #a78bfa; }
        .search-bar button {
            padding: 12px 24px; border-radius: 10px; border: none;
            background: #7c3aed; color: white; font-weight: 600;
            cursor: pointer; font-size: 1rem; transition: background 0.2s;
            white-space: nowrap;
        }
        .search-bar button:hover { background: #6d28d9; }
        .search-bar button:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Status */
        .status {
            text-align: center; padding: 40px 20px; color: #71717a;
            font-size: 0.95rem;
        }
        .status.error { color: #f87171; }
        .spinner {
            display: inline-block; width: 24px; height: 24px;
            border: 3px solid #3f3f46; border-top-color: #a78bfa;
            border-radius: 50%; animation: spin 0.7s linear infinite;
            margin-bottom: 12px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Manga list */
        .manga-list { display: flex; flex-direction: column; gap: 12px; }
        .manga-card {
            display: flex; gap: 16px; padding: 14px;
            background: #18181b; border-radius: 12px;
            border: 1px solid #27272a; cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
        }
        .manga-card:hover { border-color: #7c3aed; background: #1c1c22; }
        .manga-card img {
            width: 64px; height: 90px; object-fit: cover;
            border-radius: 6px; background: #27272a; flex-shrink: 0;
        }
        .manga-card .info { flex: 1; min-width: 0; }
        .manga-card .info h3 {
            font-size: 1rem; margin-bottom: 4px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .manga-card .info p { font-size: 0.8rem; color: #71717a; }

        /* Chapter list */
        .back-btn {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 8px 16px; border-radius: 8px; border: 1px solid #3f3f46;
            background: transparent; color: #a1a1aa; cursor: pointer;
            font-size: 0.9rem; margin-bottom: 20px; transition: all 0.2s;
        }
        .back-btn:hover { border-color: #a78bfa; color: #a78bfa; }
        .detail-header { display: flex; gap: 20px; margin-bottom: 24px; }
        .detail-header img {
            width: 120px; height: 170px; object-fit: cover;
            border-radius: 10px; background: #27272a;
        }
        .detail-header .meta { flex: 1; }
        .detail-header .meta h2 { font-size: 1.3rem; margin-bottom: 8px; }
        .detail-header .meta .tags {
            display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px;
        }
        .detail-header .meta .tags span {
            padding: 3px 10px; border-radius: 20px; font-size: 0.75rem;
            background: #27272a; color: #a1a1aa;
        }
        .chapter-list { display: flex; flex-direction: column; gap: 6px; }
        .chapter-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 16px; background: #18181b; border-radius: 8px;
            border: 1px solid #27272a; cursor: pointer;
            transition: border-color 0.2s;
        }
        .chapter-item:hover { border-color: #7c3aed; }
        .chapter-item .ch-title { font-size: 0.95rem; }
        .chapter-item .ch-date { font-size: 0.75rem; color: #71717a; }

        /* Reader */
        .reader-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 0; border-bottom: 1px solid #27272a;
            margin-bottom: 20px; flex-wrap: wrap; gap: 8px;
        }
        .reader-header .ch-info { font-size: 0.9rem; color: #a1a1aa; }
        .reader-nav { display: flex; gap: 8px; }
        .reader-nav button {
            padding: 8px 16px; border-radius: 8px; border: 1px solid #3f3f46;
            background: transparent; color: #e4e4e7; cursor: pointer;
            font-size: 0.85rem; transition: all 0.2s;
        }
        .reader-nav button:hover:not(:disabled) {
            border-color: #a78bfa; color: #a78bfa;
        }
        .reader-nav button:disabled { opacity: 0.3; cursor: not-allowed; }

        .reader-pages { display: flex; flex-direction: column; align-items: center; gap: 0; }
        .reader-pages img {
            width: 100%; max-width: 800px; display: block;
            background: #18181b; min-height: 100px;
        }
        .reader-pages img[data-loaded="false"] {
            opacity: 0.3; min-height: 200px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>📖 Baca Manga</h1>
        <span>Powered by Nyora SDK</span>
    </div>

    <!-- Search -->
    <div class="search-bar" id="searchBar">
        <input type="text" id="searchInput" placeholder="Cari judul manga/manhwa..." autocomplete="off">
        <button id="searchBtn">Cari</button>
    </div>

    <!-- Status -->
    <div class="status" id="status">
        <div>Ketik judul dan tekan Cari untuk memulai.</div>
    </div>

    <!-- Content area -->
    <div id="content"></div>
</div>

<script type="module">
    import Nyora, { readingOrder, nextChapter, previousChapter } from 'https://esm.sh/nyora-sdk@2.0.3';

    const client = new Nyora();

    // State
    let currentSource = null;
    let currentManga = null;
    let currentDetails = null;
    let currentChapter = null;
    let currentPages = [];
    let allChapters = [];

    // DOM refs
    const statusEl = document.getElementById('status');
    const contentEl = document.getElementById('content');
    const searchInput = document.getElementById('searchInput');
    const searchBtn = document.getElementById('searchBtn');

    // --- Helpers ---
    function showStatus(msg, isError = false) {
        statusEl.innerHTML = isError
            ? `<div class="status error">${msg}</div>`
            : `<div class="spinner"></div><div>${msg}</div>`;
        statusEl.style.display = 'block';
        contentEl.innerHTML = '';
    }

    function hideStatus() { statusEl.style.display = 'none'; }

    function showContent(html) {
        hideStatus();
        contentEl.innerHTML = html;
    }

    // --- 1. Inisialisasi sumber ---
    async function initSource() {
        if (currentSource) return currentSource;
        // Gunakan MangaDex sebagai sumber default yang stabil
        currentSource = await client.sources.find('mangadex');
        if (!currentSource) throw new Error('Sumber MangaDex tidak tersedia.');
        return currentSource;
    }

    // --- 2. Pencarian ---
    async function searchManga(query) {
        if (!query.trim()) return;
        showStatus('Mencari...');
        searchBtn.disabled = true;

        try {
            const source = await initSource();
            const results = await client.manga.search(source.id, query.trim(), 1);

            if (!results.entries.length) {
                showStatus('Tidak ada hasil. Coba kata kunci lain.', true);
                return;
            }

            const cards = results.entries.map(m => `
                <div class="manga-card" data-url="${encodeURIComponent(m.url)}" data-title="${encodeURIComponent(m.title)}">
                    <img src="${m.coverUrl || ''}" alt="${m.title}" loading="lazy"
                         onerror="this.style.display='none'">
                    <div class="info">
                        <h3>${escapeHtml(m.title)}</h3>
                        <p>${m.authors?.join(', ') || 'Penulis tidak diketahui'}</p>
                    </div>
                </div>
            `).join('');

            showContent(`<div class="manga-list">${cards}</div>`);

            // Bind card clicks
            document.querySelectorAll('.manga-card').forEach(el => {
                el.addEventListener('click', () => {
                    const url = decodeURIComponent(el.dataset.url);
                    const title = decodeURIComponent(el.dataset.title);
                    loadMangaDetail(url, title);
                });
            });
        } catch (e) {
            showStatus(`Gagal mencari: ${e.message}`, true);
        } finally {
            searchBtn.disabled = false;
        }
    }

    // --- 3. Detail manga & daftar chapter ---
    async function loadMangaDetail(url, title) {
        showStatus('Memuat detail manga...');
        try {
            const source = await initSource();
            const details = await client.manga.details(source.id, url, { title });
            currentDetails = details;
            allChapters = readingOrder(details.chapters || []);

            if (!allChapters.length) {
                showStatus('Tidak ada chapter tersedia.', true);
                return;
            }

            const tags = (details.tags || []).slice(0, 6).map(t => `<span>${escapeHtml(t)}</span>`).join('');
            const chapterItems = allChapters.map((ch, idx) => `
                <div class="chapter-item" data-idx="${idx}">
                    <span class="ch-title">${escapeHtml(ch.title || `Chapter ${ch.number || idx + 1}`)}</span>
                    <span class="ch-date">${ch.uploadDate ? new Date(ch.uploadDate).toLocaleDateString('id-ID') : ''}</span>
                </div>
            `).join('');

            showContent(`
                <button class="back-btn" id="backToSearch">← Kembali</button>
                <div class="detail-header">
                    <img src="${details.coverUrl || ''}" alt="${details.title}"
                         onerror="this.style.display='none'">
                    <div class="meta">
                        <h2>${escapeHtml(details.title || title)}</h2>
                        <p style="color:#71717a;font-size:0.85rem;">
                            ${details.authors?.join(', ') || ''}
                        </p>
                        <div class="tags">${tags}</div>
                    </div>
                </div>
                <div class="chapter-list">${chapterItems}</div>
            `);

            document.getElementById('backToSearch').addEventListener('click', () => {
                searchManga(searchInput.value);
            });

            document.querySelectorAll('.chapter-item').forEach(el => {
                el.addEventListener('click', () => {
                    const idx = parseInt(el.dataset.idx);
                    loadChapter(idx);
                });
            });
        } catch (e) {
            showStatus(`Gagal memuat detail: ${e.message}`, true);
        }
    }

    // --- 4. Baca chapter ---
    async function loadChapter(index) {
        if (!currentDetails || !allChapters[index]) return;
        currentChapter = allChapters[index];
        showStatus('Memuat halaman chapter...');

        try {
            const source = await initSource();
            const pages = await client.manga.pages(source.id, currentChapter.url, {
                branch: currentChapter.branch
            });
            currentPages = pages;

            if (!pages.length) {
                showStatus('Tidak ada gambar di chapter ini.', true);
                return;
            }

            const prevCh = previousChapter(allChapters, currentChapter);
            const nextCh = nextChapter(allChapters, currentChapter);
            const chTitle = escapeHtml(currentChapter.title || `Chapter ${currentChapter.number || index + 1}`);

            const pageImgs = pages.map((p, i) => `
                <img src="${p.url}" alt="Halaman ${i + 1}" loading="lazy"
                     data-loaded="false"
                     onload="this.dataset.loaded='true'"
                     onerror="this.style.display='none'">
            `).join('');

            showContent(`
                <div class="reader-header">
                    <button class="back-btn" id="backToDetail" style="margin:0;">← Chapter</button>
                    <span class="ch-info">${chTitle}</span>
                    <div class="reader-nav">
                        <button id="prevCh" ${!prevCh ? 'disabled' : ''}>‹ Sebelumnya</button>
                        <button id="nextCh" ${!nextCh ? 'disabled' : ''}>Berikutnya ›</button>
                    </div>
                </div>
                <div class="reader-pages">${pageImgs}</div>
            `);

            // Bind navigasi
            document.getElementById('backToDetail').addEventListener('click', () => {
                loadMangaDetail(currentManga?.url || currentDetails.url, currentDetails.title);
            });

            document.getElementById('prevCh')?.addEventListener('click', () => {
                if (!prevCh) return;
                const newIdx = allChapters.indexOf(prevCh);
                if (newIdx >= 0) loadChapter(newIdx);
            });

            document.getElementById('nextCh')?.addEventListener('click', () => {
                if (!nextCh) return;
                const newIdx = allChapters.indexOf(nextCh);
                if (newIdx >= 0) loadChapter(newIdx);
            });

            // Scroll ke atas
            window.scrollTo({ top: 0, behavior: 'smooth' });
        } catch (e) {
            showStatus(`Gagal memuat chapter: ${e.message}`, true);
        }
    }

    // --- Utility ---
    function escapeHtml(str) {
        if (!str) return '';
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    // --- Event listeners ---
    searchBtn.addEventListener('click', () => searchManga(searchInput.value));
    searchInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') searchManga(searchInput.value);
    });

    // Muat sumber saat pertama kali
    initSource().catch(e => showStatus(`Inisialisasi gagal: ${e.message}`, true));
</script>
</body>
</html>
